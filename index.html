<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"
    <title>Streetwear Aura | Digital Experience</title>
</head>
<body>
    <nav>
        <div class="logo">AURA_STUDIO</div>
        <ul>
            <li>COLLECTION</li>
            <li>DROP 2026</li>
            <li>CONTACT</li>
        </ul>
    </nav>

    <header>
        <h1>NEW ERA <br><span>URBAN STYLE</span></h1>
        <p>Originality is the only rule. Elevate your presence.</p>
        <button>EXPLORE DROP</button>
    </header>
    <section class="products">
    <h2>NEW DROPS</h2>
    <div class="product-grid">
        <div class="product-card">
            <div class="product-img">
                <img src="hoodie1.jpg" alt="Aura Hoodie">
            </div>
            <p class="product-name">AURA_OVERSIZE HOODIE</p>
            <p class="product-price">$65.00</p>
        </div>
        <div class="product-card">
            <div class="product-img">
                <img src="tshirt1.jpg" alt="Street T-Shirt">
            </div>
            <p class="product-name">URBAN_AURA T-SHIRT</p>
            <p class="product-price">$35.00</p>
        </div>
        </div>
</section>
<section class="contact">
    <h3>GET IN TOUCH</h3>
    <form>
        <input type="text" placeholder="NAME">
        <input type="email" placeholder="EMAIL">
        <textarea placeholder="PROJECT DETAILS"></textarea>
        <button type="submit">SEND MESSAGE</button>
    </form>
</section>
    <script src="script.js"></script>
</body>
</html>
